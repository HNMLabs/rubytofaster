name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-dogfood:
    name: Ruby ${{ matrix.ruby }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        ruby: ["3.1", "3.2", "3.3", "3.4"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: false

      - name: Run Minitest suite (warnings enabled)
        run: rake test

      - name: Self-hosted build, SBOM, SLSA provenance & reproducibility verification
        run: |
          ./gem.build.rb
          VER=$(ruby -Ilib -rrubytofaster/version -e 'puts RubyToFaster::VERSION')
          GEM_FILE="pkg/rubytofaster-${VER}.gem"
          SHA1=$(ruby -rdigest -e "puts Digest::SHA256.file('${GEM_FILE}').hexdigest")

          ./exe/rtf build --no-cache --sbom --provenance --out-dir pkg-verify
          SHA2=$(ruby -rdigest -e "puts Digest::SHA256.file('pkg-verify/rubytofaster-${VER}.gem').hexdigest")
          test "$SHA1" = "$SHA2"

          test -f "pkg-verify/rubytofaster-${VER}.gem.sha256"
          test -f "pkg-verify/rubytofaster-${VER}.gem.provenance.json"
          test -f "pkg-verify/rubytofaster-${VER}.gem.sbom.cdx.json"

          ./exe/rtf inspect "$GEM_FILE"
          ./exe/rtf analyze "$GEM_FILE" --html pkg/bundle-report.html
          test -f pkg/bundle-report.html

          ./exe/rtf bench -n 3
          gem install --local "$GEM_FILE" --no-document
          rtf --version
